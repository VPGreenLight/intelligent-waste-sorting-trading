$kind: http-request
name: Submit Scan Feedback
url: "{{backendUrl}}/api/v1/waste-scan/feedback"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: raw
  raw: |-
    {
      "imageUrl": "https://example.com/waste-sample.jpg",
      "predictedLabel": "plastic",
      "confidenceScore": 0.65,
      "userReportedLabel": "paper",
      "note": "Hộp sữa giấy tráng nhôm bị nhận diện nhầm thành nhựa"
    }
order: 4000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Feedback acknowledged", function () {
          pm.expect(jsonData.success).to.be.true;
      });
    language: text/javascript
