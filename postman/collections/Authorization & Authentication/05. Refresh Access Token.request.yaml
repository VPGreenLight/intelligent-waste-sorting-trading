$kind: http-request
name: 05. Refresh Access Token
url: "{{backendUrl}}/api/v1/auth/refresh-token"
method: POST
headers:
  - key: Content-Type
    value: "application/json"
body:
  type: raw
  raw: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
order: 5000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 401", function () {
          pm.expect([200, 401]).to.include(pm.response.code);
      });
      var jsonData = pm.response.json();
      if (jsonData.success) {
          var token = (jsonData.data && jsonData.data.accessToken) || jsonData.token;
          if (token) {
              pm.environment.set("bearerToken", token);
          }
          var rToken = (jsonData.data && jsonData.data.refreshToken) || jsonData.refreshToken;
          if (rToken) {
              pm.environment.set("refreshToken", rToken);
          }
      }
    language: text/javascript
