$kind: http-request
name: 03. Login
url: "{{backendUrl}}/api/v1/auth/login"
method: POST
headers:
  - key: Content-Type
    value: "application/json"
body:
  type: raw
  raw: |-
    {
      "usernameOrEmail": "citizen",
      "password": "citizen123"
    }
order: 3000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Login successful and token returned", function () {
          pm.expect(jsonData.success).to.be.true;
          var token = (jsonData.data && jsonData.data.accessToken) || jsonData.token;
          pm.expect(token).to.not.be.empty;
      });
      var token = (jsonData.data && jsonData.data.accessToken) || jsonData.token;
      if (token) {
          pm.environment.set("bearerToken", token);
      }
      var rToken = (jsonData.data && jsonData.data.refreshToken) || jsonData.refreshToken;
      if (rToken) {
          pm.environment.set("refreshToken", rToken);
      }
      var user = (jsonData.data && jsonData.data.user) || jsonData.user;
      if (user && user.id) {
          pm.environment.set("demoUserId", user.id);
      }
    language: text/javascript
