$kind: http-request
name: Register User
url: "{{backendUrl}}/api/v1/auth/register"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: raw
  raw: |-
    {
      "username": "hoangthang",
      "email": "hoangthang@example.com",
      "password": "Password123@",
      "fullName": "Nguyen Hoang Thang",
      "phoneNumber": "0987654321",
      "role": 1
    }
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 400", function () {
          pm.expect([200, 400]).to.include(pm.response.code);
      });
      var jsonData = pm.response.json();
      if (jsonData.success && jsonData.token) {
          pm.environment.set("bearerToken", jsonData.token);
      }
    language: text/javascript
