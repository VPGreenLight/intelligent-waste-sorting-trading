$kind: http-request
name: 01. Register Citizen User
url: "{{backendUrl}}/api/v1/auth/register"
method: POST
headers:
  - key: Content-Type
    value: "application/json"
body:
  type: raw
  raw: |-
    {
      "username": "hoangthang",
      "email": "hoangthang@example.com",
      "password": "Password123@",
      "fullName": "Nguyen Hoang Thang",
      "phoneNumber": "0987654321"
    }
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 400", function () {
          pm.expect([200, 201, 400]).to.include(pm.response.code);
      });
      var jsonData = pm.response.json();
      var token = (jsonData.data && jsonData.data.accessToken) || jsonData.token;
      if (token) {
          pm.environment.set("bearerToken", token);
      }
      var rToken = (jsonData.data && jsonData.data.refreshToken) || jsonData.refreshToken;
      if (rToken) {
          pm.environment.set("refreshToken", rToken);
      }
    language: text/javascript
