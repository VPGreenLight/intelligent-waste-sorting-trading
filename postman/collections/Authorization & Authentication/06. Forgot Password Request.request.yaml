$kind: http-request
name: 06. Forgot Password Request
url: "{{backendUrl}}/api/v1/auth/forgot-password"
method: POST
headers:
  - key: Content-Type
    value: "application/json"
body:
  type: raw
  raw: |-
    {
      "email": "citizen@example.com"
    }
order: 6000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Forgot password generic response (BR-AUTH-06)", function () {
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.messageCode).to.equal("MSG-AUTH-05");
      });
    language: text/javascript
