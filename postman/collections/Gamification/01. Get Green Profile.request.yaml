$kind: http-request
name: Get Green Profile
url: "{{backendUrl}}/api/v1/gamification/profile/{{demoUserId}}"
method: GET
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Profile returned with points and tree level", function () {
          pm.expect(jsonData).to.have.property("currentGreenPoints");
          pm.expect(jsonData).to.have.property("treeLevel");
      });
    language: text/javascript
