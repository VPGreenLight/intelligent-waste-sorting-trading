$kind: http-request
name: Get Contribution Leaderboard
url: "{{backendUrl}}/api/v1/gamification/leaderboard?top=10"
method: GET
order: 2000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Leaderboard array returned", function () {
          pm.expect(jsonData).to.be.an("array");
      });
    language: text/javascript
