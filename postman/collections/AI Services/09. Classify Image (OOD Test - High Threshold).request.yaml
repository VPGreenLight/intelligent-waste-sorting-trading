$kind: http-request
name: Classify Image (OOD Test - High Threshold)
url: "{{baseUrl}}/api/v1/classify"
method: POST
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ""
    - key: model
      value: "yolov8n"
      type: text
    - key: confidence_threshold
      value: "0.99"
      type: text
order: 9000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Out-of-Distribution is correctly flagged", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.is_out_of_distribution).to.be.true;
      });
    language: text/javascript
