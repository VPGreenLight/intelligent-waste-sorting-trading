$kind: http-request
name: List Available Models
url: "{{baseUrl}}/api/v1/models"
method: GET
order: 2000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Models list is returned", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.models).to.be.an("array");
          pm.expect(jsonData.models.length).to.be.at.least(1);
          pm.expect(jsonData.supported_classes).to.include("plastic");
      });
    language: text/javascript
