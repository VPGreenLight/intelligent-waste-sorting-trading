$kind: http-request
name: Classify Image (MobileNetV3)
url: "{{baseUrl}}/api/v1/classify"
method: POST
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ""
    - key: model
      value: "mobilenet_v3"
      type: text
    - key: confidence_threshold
      value: "0.60"
      type: text
order: 7000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Classification succeeded with MobileNetV3", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.model_used).to.eql("mobilenet_v3");
          pm.expect(jsonData.model_family).to.include("MobileNet");
      });
    language: text/javascript
