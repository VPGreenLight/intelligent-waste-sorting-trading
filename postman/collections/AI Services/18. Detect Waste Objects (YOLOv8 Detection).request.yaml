$kind: http-request
name: Detect Waste Objects (YOLOv8 Detection)
url: "{{baseUrl}}/api/v1/detect"
method: POST
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ""
    - key: confidence_threshold
      value: "0.25"
      type: text
order: 18000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Detection succeeded", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData).to.have.property("total_items");
          pm.expect(jsonData).to.have.property("detected_objects");
      });
    language: text/javascript
