$kind: http-request
name: Classify Image (EfficientNet-B0)
url: "{{baseUrl}}/api/v1/classify"
method: POST
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ""
    - key: model
      value: "efficientnet_b0"
      type: text
    - key: confidence_threshold
      value: "0.60"
      type: text
order: 8000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Classification succeeded with EfficientNet-B0", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.model_used).to.eql("efficientnet_b0");
      });
    language: text/javascript
